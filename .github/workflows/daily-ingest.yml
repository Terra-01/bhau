# Phase 0 stopgap: daily EOD ingestion on GitHub's machines so nothing
# depends on a laptop being awake. Retired when Inngest-on-Vercel takes
# over the daily loop (CONCEPT.md §6).
#
# Note: GitHub cron fires with jitter (minutes to ~an hour at busy times) —
# fine for EOD data. NSE may block datacenter IPs; source isolation means
# that degrades one source, and SourceHealth records it.
name: daily-ingest

on:
  schedule:
    # Off-peak minutes fire with far less GitHub jitter than :30 (observed
    # multi-hour drift; Sep 1–2 the scheduler ran 3–6h late or skipped a
    # firing entirely). Later firings are safety nets — ingest is
    # idempotent and the floor loop is once-per-session guarded, so a
    # redundant run no-ops.
    - cron: "47 11 * * 1-5" # ~17:17 IST, Mon–Fri (after the 15:30 close)
    - cron: "17 14 * * 1-5" # ~19:47 IST fallback
    - cron: "47 17 * * 1-5" # ~23:17 IST last-chance net before the IST day ends
  workflow_dispatch: {}

concurrency: daily-ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }} # daily synthesis; skips gracefully without it
      # The Floor: fill yesterday's decisions at today's open, mark to
      # market, deliberate for tomorrow. Without OPENAI_KEY the
      # deliberation step skips gracefully (fills/MTM still run).
      - run: npm run floor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      - run: npm run floor:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
