# Phase 0 stopgap: daily EOD ingestion on GitHub's machines so nothing
# depends on a laptop being awake. Retired when Inngest-on-Vercel takes
# over the daily loop (CONCEPT.md §6).
#
# Note: GitHub cron fires with jitter (minutes to ~an hour at busy times) —
# fine for EOD data. NSE may block datacenter IPs; source isolation means
# that degrades one source, and SourceHealth records it.
name: daily-ingest

on:
  schedule:
    # Slots follow the Indian market's publication timeline, not the clock:
    # NSE closes 15:30 IST, but the data an honest EOD run needs lands
    # later — provisional FII/DII ~18:00-19:00, UDiFF bhavcopy ~18:00-18:30,
    # AMFI NAV ~21:00-23:00. (No market-open cron on purpose: ingest is EOD
    # by design, fills use bhavcopy's official open print, and the session
    # itself is served by the live client layer.)
    # Off-peak minutes fire with far less GitHub jitter than :00/:30
    # (observed drift 55min-6h; slots occasionally skip). Every firing is
    # idempotent — ingest upserts, the floor is once-per-session guarded —
    # and agents/run.ts defers deliberation until today's closes are in the
    # pack (or 21:00 IST), so an early slot can only mark and fill, never
    # lock a stale decision.
    - cron: "17 13 * * 1-5" # ~18:47 IST — bhavcopy + FII/DII usually published; the run that fills, marks, and deliberates
    - cron: "47 14 * * 1-5" # ~20:17 IST — fallback for late publications / a skipped first slot
    - cron: "47 16 * * 1-5" # ~22:17 IST — last-chance net; also catches the late AMFI NAV for the benchmark re-mark, with headroom so drift cannot overshoot IST midnight
  workflow_dispatch: {}

concurrency: daily-ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }} # daily synthesis; skips gracefully without it
      # The Floor: fill yesterday's decisions at today's open, mark to
      # market, deliberate for tomorrow. Without OPENAI_KEY the
      # deliberation step skips gracefully (fills/MTM still run).
      - run: npm run floor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      - run: npm run floor:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
